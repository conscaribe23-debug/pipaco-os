plugins { id 'com.android.application' }

import groovy.json.JsonSlurper

// ÚNICO lugar de configuración de la prueba: web/trial-config.json (días, límites, marca PDF, contacto).
def cfgFile = rootProject.file('web/trial-config.json')
def cfg = new JsonSlurper().parse(cfgFile, 'UTF-8')

// Genera assets/www/index.html desde la app real (../index.html) + capa de prueba (web/trial.js), sin tocar la app real.
tasks.register('buildTrialWeb', Exec) {
    inputs.files(cfgFile, rootProject.file('web/trial.js'), rootProject.file('web/trial.css'), rootProject.file('web/build_trial.py'), rootProject.file('../index.html'))
    outputs.dir(file('src/main/assets/www'))
    commandLine 'python3', rootProject.file('web/build_trial.py').absolutePath, file('src/main/assets/www/index.html').absolutePath
}
tasks.named('preBuild') { dependsOn 'buildTrialWeb' }

// Firma con el keystore DE LA PRUEBA (distinto al de la app real y al de la demo). keystore.properties no se sube.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    buildFeatures { buildConfig true }
    namespace 'com.pipaco.trial'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pipaco.trial'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'int', 'DIAS_PRUEBA', String.valueOf(cfg.dias as int)
        buildConfigField 'String', 'CORREO', '"' + cfg.correo + '"'
        buildConfigField 'String', 'WHATSAPP', '"' + (cfg.whatsapp ?: '').replaceAll('\\D', '') + '"'
        buildConfigField 'int', 'MAX_VENTAS', String.valueOf(cfg.maxVentas as int)
        buildConfigField 'int', 'MAX_CLIENTES', String.valueOf(cfg.maxClientes as int)
        buildConfigField 'int', 'MAX_COMPROBANTES', String.valueOf(cfg.maxComprobantes as int)
        buildConfigField 'int', 'MAX_PRODUCTOS', String.valueOf(cfg.maxProductos as int)
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (ksFile.exists()) signingConfig signingConfigs.release } }
    testOptions { unitTests { includeAndroidResources = true; all { maxHeapSize = '1g' } } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
