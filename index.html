<style>:root{--bg:#09090b;--card:#18181b;--card2:#202024;--bd:#2e2e33;--tx:#f4f4f5;--mu:#a1a1aa;--ac:#fbbf24;--ac2:#f59e0b;--ok:#22c55e;--bad:#ef4444;--warn:#f97316;--info:#38bdf8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
a{color:var(--ac)}button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:18px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ac);color:#111;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand b{display:block;font-size:17px}.brand small{color:var(--mu);font-size:11px}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mu);display:flex;gap:10px;align-items:center}
.nav button:hover{background:var(--card2);color:var(--tx)}.nav button.on{background:rgba(251,191,36,.12);color:var(--ac);font-weight:600}
.nav .badge{margin-left:auto}
main{flex:1;min-width:0;padding:20px 24px 90px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:22px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.kpi .l{color:var(--mu);font-size:12px}.kpi .v{font-size:22px;font-weight:700;margin-top:4px}.kpi .s{color:var(--mu);font-size:12px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mu{color:var(--mu)}.ac{color:var(--ac)}.sm{font-size:12px}.r{text-align:right}.b{font-weight:700}
.btn{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:#52525b}.btn.p{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}.btn.d{color:#fca5a5;border-color:#7f1d1d}.btn.ok{background:#14532d;border-color:#166534;color:#bbf7d0}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:8px}.btn.lg{padding:14px 16px;font-size:16px;border-radius:12px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--mu)}.seg button.on{background:var(--ac);color:#111;font-weight:600}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.tag{display:inline-block;border-radius:999px;font-size:11px;padding:2px 8px;border:1px solid var(--bd);white-space:nowrap}
.tag.ok{background:rgba(34,197,94,.12);color:#86efac;border-color:#166534}.tag.bad{background:rgba(239,68,68,.12);color:#fca5a5;border-color:#7f1d1d}.tag.warn{background:rgba(249,115,22,.12);color:#fdba74;border-color:#9a3412}.tag.info{background:rgba(56,189,248,.12);color:#7dd3fc;border-color:#075985}
.tbl{width:100%;overflow-x:auto}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
table.rt th{text-align:left;color:var(--mu);font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
table.rt td{padding:8px;border-bottom:1px solid #222226;vertical-align:middle}
table.rt td.num,table.rt th.num{text-align:right;white-space:nowrap}
table.rt tr.tot td{font-weight:700;border-top:2px solid var(--bd)}
.acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;border:1px solid}
.alert.bad{background:rgba(239,68,68,.08);border-color:#7f1d1d}.alert.warn{background:rgba(249,115,22,.08);border-color:#9a3412}.alert.info{background:rgba(56,189,248,.08);border-color:#075985}.alert.ok{background:rgba(34,197,94,.08);border-color:#166534}
.alert .t{flex:1}
.bar{height:12px;background:var(--card2);border-radius:999px;overflow:hidden;border:1px solid var(--bd)}.bar>div{height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.empty{color:var(--mu);text-align:center;padding:24px 10px}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{font-size:12px;color:var(--mu)}
.fld input,.fld select,.fld textarea,.inp{background:#0f0f12;border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid rgba(251,191,36,.4);border-color:var(--ac)}
.fld.full{grid-column:1/-1}
.chk{display:flex!important;flex-direction:row!important;gap:8px;align-items:center;color:var(--tx)!important;font-size:14px!important;padding:8px 0}
.chk input{width:20px;height:20px}
.days{display:flex;gap:4px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:3px;background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;color:var(--tx);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:18px;width:100%;max-width:640px;padding:18px;margin:auto 0}
.modal h3{margin:0 0 14px;display:flex;align-items:center}.modal h3 span{flex:1}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prev{background:#0f0f12;border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;font-size:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.itrow{display:grid;grid-template-columns:2fr 1.4fr .8fr .9fr .9fr auto;gap:6px;align-items:center;margin-bottom:6px}
.itrow input,.itrow select{background:#0f0f12;border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0;width:100%}
.ithead{font-size:11px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14532d;color:#dcfce7;border:1px solid #166534;padding:10px 16px;border-radius:12px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.toast.bad{background:#7f1d1d;border-color:#991b1b;color:#fee2e2}
.bnav{display:none}
.demo{background:#422006;border:1px solid #a16207;color:#fde68a;padding:10px 14px;border-radius:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card2);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:15px}
.chip.on{border-color:var(--ac);background:rgba(251,191,36,.15);color:var(--ac);font-weight:600}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:48px;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);font-size:22px;cursor:pointer}
.qty input{width:90px;text-align:center;font-size:22px;font-weight:700;background:#0f0f12;border:1px solid var(--bd);border-radius:12px;padding:8px}
.big{font-size:28px;font-weight:800}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:28px}
.sheet button{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:14px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.sheet button span{font-size:22px}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){
 .side{display:none}main{padding:14px 12px 96px}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:4px 0;position:relative}
 .bnav button span{font-size:20px}.bnav button.on{color:var(--ac)}
 .bnav .badge{position:absolute;top:0;right:18%;font-size:10px}
 .g2,.g3{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr}
 .top h1{font-size:19px}
 table.rt thead{display:none}
 table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
 table.rt tr{background:var(--card2);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;padding:6px 10px}
 table.rt td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 0;text-align:right}
 table.rt td::before{content:attr(data-l);color:var(--mu);font-size:12px;text-align:left}
 table.rt td.num{text-align:right}
 table.rt td.acts-td::before{content:""}
 table.rt tr.tot{background:rgba(251,191,36,.08)}
 .itrow{grid-template-columns:1fr 1fr;background:#0f0f12;border:1px solid var(--bd);border-radius:10px;padding:8px}
 .ithead{display:none}
 .modal-bg{padding:0}.modal{border-radius:0;min-height:100vh;max-width:none}
}
/* ---- App instalada: zonas seguras (notch / isla / barra de gestos) ---- */
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
main{padding-top:calc(20px + env(safe-area-inset-top))}
.side{padding-top:env(safe-area-inset-top)}
#authov{padding-top:calc(16px + env(safe-area-inset-top))!important;padding-bottom:calc(16px + env(safe-area-inset-bottom))!important}
.modal-bg{padding-top:calc(20px + env(safe-area-inset-top))}
.sheet>div{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.toast{bottom:calc(90px + env(safe-area-inset-bottom))}
@media(max-width:760px){main{padding-top:calc(14px + env(safe-area-inset-top))}.modal-bg{padding:env(safe-area-inset-top) 0 0}.modal{padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
#pwa-inst{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:10001;display:flex;align-items:center;gap:2px;background:var(--ac);color:#111;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.55);font-weight:700}
#pwa-inst button{background:none;border:0;color:#111;cursor:pointer;font-weight:700;padding:10px 6px 10px 14px;font-size:14px}
#pwa-inst button.x{padding:10px 12px 10px 4px;font-weight:400;opacity:.7}
@media(max-width:760px){#pwa-inst{bottom:calc(76px + env(safe-area-inset-bottom))}}
#pwa-upd,#apk-upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:10002;background:#1e3a8a;color:#dbeafe;border:1px solid #3b82f6;border-radius:12px;padding:12px 16px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.6);font-weight:600;max-width:92vw;text-align:center}
.ios-steps{margin:10px 0 0;padding-left:20px;line-height:1.7}
.ios-steps b{color:var(--ac)}
@media print{.side,.bnav,.btn,.seg{display:none!important}main{padding:0}body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff}}
</style>

<body>
<div class="app" style="display:none">
 <aside class="side"><div class="brand"><div class="logo">🥥</div><div><b id="bname">PipaCo</b><small>OS PRO v2 · Agua de pipa · Boquete</small></div></div><nav class="nav" id="nav"></nav>
 <div style="margin-top:auto;padding:12px 16px;font-size:11px;color:#71717a">Funciona sin internet. Datos guardados en este navegador.<br><button class="btn xs" style="margin-top:8px" onclick="AUTH.cerrarSesion()">🔒 Cerrar sesión</button></div></aside>
 <main id="main"></main>
</div>

<noscript>Activa JavaScript para usar PipaCo OS.</noscript>
<script>
'use strict';
/* ===================== PipaCo OS PRO v2 — núcleo ===================== */
const KEY='pipaco_os_v2';
const CANALES={carrito:'Carrito / carro',distribucion:'Distribución',embotellado:'Embotellado'};
const CANAL_ICO={carrito:'🛒',distribucion:'🚚',embotellado:'🧴'};
const CANAL_COLOR={carrito:'#f59e0b',distribucion:'#22c55e',embotellado:'#38bdf8'};
const METODOS=['Efectivo','Yappy','Transferencia','Tarjeta','Crédito'];
const METODOS_PAGO=['Efectivo','Yappy','Transferencia','Tarjeta'];
const TIPOS_PROD={compra:'Se compra y se vende (ej. pipa)',insumo:'Insumo (solo para producir)',producido:'Se produce con receta (ej. embotellado)'};
const ORIGEN_DEP=['Efectivo de ventas','Cobro a cliente (efectivo)','Aporte del dueño','Préstamo','Otro ingreso'];
const DIAS=['D','L','M','X','J','V','S'];
const DIAS_L=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cuentaDe=m=>m==='Efectivo'?'Caja':m==='Crédito'?'Cuentas por cobrar':'Banco';

function hoy(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)} // fecha LOCAL (Panamá), no UTC
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return hoy(d)}
function diasEntre(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const $f=n=>(n<-0.004?'-':'')+'$'+Math.abs(n).toLocaleString('es-PA',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=n=>(Math.round(n*100)/100).toLocaleString('es-PA',{maximumFractionDigits:2});
const pct=n=>isFinite(n)?(n*100).toFixed(1)+'%':'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtF=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtMes=m=>{const[y,mm]=m.split('-');return MESES[+mm-1]+' '+y};
const lista=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);

function prodBase(o){return Object.assign({id:uid(),nombre:'',tipo:'compra',unidad:'unid.',stockInicial:0,stockMin:0,costoManual:0,precioCarrito:0,precioDistribucion:0,precioEmbotellado:0,itbms:0,costoExtra:0,r1p:'',r1c:0,r2p:'',r2c:0,r3p:'',r3c:0},o)}
function estadoInicial(){return{v:2,demo:false,creado:hoy(),config:{negocio:'PipaCo',propietario:'Luis Gabriel Delgado',telefono:'',ubicacion:'Boquete, Chiriquí',metaMensual:0,diasTrabajo:26,diasCreditoDef:15,fondoCaja:20,alertaEfectivo:150,saldoInicialCaja:0,saldoInicialBanco:0,fechaInicio:hoy(),itbmsCompraDef:7,horizonte:7,
 bancos:'Banco General, Banistmo, Caja de Ahorros, BAC, Banco Nacional',
 categoriasGasto:'Gasolina, Hielo, Sueldos y ayudantes, Alquiler, Permisos y trámites, Mantenimiento, Publicidad, Empaques y etiquetas, Machetes y herramientas, Otros',
 msgCobro:'Hola {cliente}, le saluda {negocio}. Le recordamos su saldo pendiente de {saldo} ({vencido} vencido). ¡Muchas gracias!',
 msgPedido:'Hola {cliente}, le confirma {negocio}: pedido de {cantidad} {producto} para el {fecha}. Total {total}. ¡Gracias!'},
 productos:[prodBase({id:'pipa',nombre:'Pipa (coco verde)',tipo:'compra',stockMin:30}),prodBase({id:'botella',nombre:'Botella vacía con tapa',tipo:'insumo',stockMin:50}),prodBase({id:'agua',nombre:'Agua de pipa embotellada',tipo:'producido',stockMin:12,r1p:'pipa',r1c:2,r2p:'botella',r2c:1})],
 ventas:[],produccion:[],ajustes:[],clientes:[],pedidos:[],recurrentes:[],cobros:[],gastos:[],facturas:[],depositos:[],fijos:[]}}

let S=cargar();
function cargar(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);const b=estadoInicial();const out=Object.assign(b,d);out.config=Object.assign(estadoInicial().config,d.config||{});
 ['ventas','produccion','ajustes','clientes','pedidos','recurrentes','cobros','gastos','facturas','depositos','fijos','productos'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[]});return out}}catch(e){console.warn('No se pudo leer',e)}return estadoInicial()}
let _calc=null;
function guardar(){_calc=null;S.actualizado=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar (memoria llena). Exporta un respaldo y borra fotos viejas.',1)}}

const P=id=>S.productos.find(p=>p.id===id);
const CL=id=>S.clientes.find(c=>c.id===id);
const nomP=id=>P(id)?.nombre||'(producto borrado)';
const nomC=id=>id?(CL(id)?.nombre||'(cliente borrado)'):'Público';
function receta(p){const r=[];[1,2,3].forEach(i=>{if(p['r'+i+'p']&&num(p['r'+i+'c'])>0)r.push({pid:p['r'+i+'p'],cant:num(p['r'+i+'c'])})});return r}
function precioCanal(p,canal){if(!p)return 0;return num(p[{carrito:'precioCarrito',distribucion:'precioDistribucion',embotellado:'precioEmbotellado'}[canal]])}
const vendibles=()=>S.productos.filter(p=>p.tipo!=='insumo');
function ajusteSigno(a){return a.tipoAj==='suma'?num(a.cant):-num(a.cant)}

/* ---------- Cálculo central: TODO se deriva de los registros ---------- */
function calc(){if(_calc)return _calc;const C=S.config,t=hoy();const PM={};S.productos.forEach(p=>PM[p.id]=p);
 const cQ={},cV={};
 S.facturas.forEach(f=>(f.items||[]).forEach(it=>{if(it.pid&&PM[it.pid]){cQ[it.pid]=(cQ[it.pid]||0)+num(it.cant);cV[it.pid]=(cV[it.pid]||0)+num(it.cant)*num(it.cu)}}));
 const costo={};const fuenteCosto={};
 const cost=(id,dep=0)=>{if(costo[id]!=null)return costo[id];const p=PM[id];if(!p||dep>6)return 0;let c;const rec=receta(p);
  if(p.tipo==='producido'&&rec.length){c=rec.reduce((a,r)=>a+cost(r.pid,dep+1)*r.cant,0)+num(p.costoExtra);fuenteCosto[id]='receta'}
  else if(cQ[id]>0){c=cV[id]/cQ[id];fuenteCosto[id]='facturas'}else{c=num(p.costoManual);fuenteCosto[id]='manual'}return costo[id]=c};
 S.productos.forEach(p=>cost(p.id));
 const stock={};S.productos.forEach(p=>stock[p.id]=num(p.stockInicial)+(cQ[p.id]||0));
 S.produccion.forEach(x=>{const p=PM[x.pid];if(!p)return;stock[p.id]+=num(x.cant);receta(p).forEach(r=>{if(stock[r.pid]!=null)stock[r.pid]-=r.cant*num(x.cant)})});
 const ajustes=S.ajustes.map(a=>{const s=ajusteSigno(a);if(stock[a.pid]!=null)stock[a.pid]+=s;return{...a,signo:s,valor:r2(s*(costo[a.pid]||0))}});
 const ventas=S.ventas.map(v=>{const total=r2(num(v.cant)*num(v.precio));const rate=num(v.itbms);const sub=r2(total/(1+rate/100));const c=r2(num(v.cant)*(costo[v.pid]||0));if(stock[v.pid]!=null)stock[v.pid]-=num(v.cant);
  return{...v,total,sub,itbmsM:r2(total-sub),costo:c,margen:r2(sub-c)}});
 // Cuentas por cobrar (FIFO: los cobros pagan primero las ventas más viejas)
 const cli={};S.clientes.forEach(c=>cli[c.id]={...c,credito:0,cobrado:0,saldo:0,vencido:0,compras:0,ultima:''});
 S.cobros.forEach(x=>{if(cli[x.cid])cli[x.cid].cobrado+=num(x.monto)});
 const resto={};Object.values(cli).forEach(c=>resto[c.id]=c.cobrado);
 ventas.forEach(v=>{const c=cli[v.cid];if(c){c.compras+=v.total;if(v.fecha>c.ultima)c.ultima=v.fecha}});
 ventas.filter(v=>v.metodo==='Crédito').sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(v=>{const c=cli[v.cid];const dc=c&&c.diasCredito!==''&&c.diasCredito!=null?num(c.diasCredito):num(C.diasCreditoDef);v.venc=addDays(v.fecha,dc);let pag=0;if(c){pag=Math.min(v.total,resto[v.cid]);resto[v.cid]-=pag}v.pagado=r2(pag);v.pend=r2(v.total-pag);v.vencida=v.pend>0.004&&v.venc<t;if(c){c.credito+=v.total;c.saldo+=v.pend;if(v.vencida)c.vencido+=v.pend}});
 Object.values(cli).forEach(c=>{c.saldo=r2(c.saldo);c.vencido=r2(c.vencido);c.aFavor=r2(Math.max(0,resto[c.id]))});
 const facturas=S.facturas.map(f=>{const items=f.items||[];const sub=r2(items.reduce((a,i)=>a+num(i.cant)*num(i.cu),0));const inv=r2(items.filter(i=>i.pid&&PM[i.pid]).reduce((a,i)=>a+num(i.cant)*num(i.cu),0));const itb=r2(sub*num(f.itbms)/100);const total=r2(sub+itb);
  const vencida=!f.pagada&&f.venc&&f.venc<t;const porVencer=!f.pagada&&f.venc&&!vencida&&diasEntre(t,f.venc)<=3;return{...f,sub,inv,gastoM:r2(sub-inv),itbmsM:itb,total,vencida,porVencer}});
 const r={t,PM,costo,fuenteCosto,stock,ventas,ajustes,cli,facturas};
 r.libro=libroDiario(r);r.saldos=saldosCuentas(r.libro);_calc=r;return r}

/* ---------- Libro diario automático (partida doble) ---------- */
function libroDiario(r){const C=S.config,L=[];const add=(fecha,tipo,desc,lineas,ref)=>{lineas=lineas.filter(l=>Math.abs(l.d||0)>0.004||Math.abs(l.h||0)>0.004);if(lineas.length)L.push({fecha,tipo,desc,ref,lineas})};
 const invIni=S.productos.reduce((a,p)=>a+num(p.stockInicial)*(r.costo[p.id]||0),0);
 const cap=num(C.saldoInicialCaja)+num(C.saldoInicialBanco)+invIni;
 if(cap>0)add(C.fechaInicio||S.creado,'Apertura','Saldos iniciales',[{c:'Caja',d:num(C.saldoInicialCaja)},{c:'Banco',d:num(C.saldoInicialBanco)},{c:'Inventario',d:r2(invIni)},{c:'Capital',h:r2(cap)}]);
 r.ventas.forEach(v=>add(v.fecha,'Venta',`Venta ${CANALES[v.canal]||v.canal}: ${nf(num(v.cant))} ${nomP(v.pid)}${v.cid?' — '+nomC(v.cid):''} (${v.metodo})`,[{c:cuentaDe(v.metodo),d:v.total},{c:'Ventas — '+(CANALES[v.canal]||v.canal),h:v.sub},{c:'ITBMS por pagar',h:v.itbmsM},{c:'Costo de ventas',d:v.costo},{c:'Inventario',h:v.costo}],v.id));
 r.ajustes.forEach(a=>{if(a.valor<0)add(a.fecha,'Ajuste',`Merma/salida: ${nf(-a.signo)} ${nomP(a.pid)} (${a.motivo||''})`,[{c:'Mermas',d:-a.valor},{c:'Inventario',h:-a.valor}],a.id);else if(a.valor>0)add(a.fecha,'Ajuste',`Ajuste a favor: ${nf(a.signo)} ${nomP(a.pid)}`,[{c:'Inventario',d:a.valor},{c:'Otros ingresos',h:a.valor}],a.id)});
 S.cobros.forEach(x=>add(x.fecha,'Cobro',`Cobro a ${nomC(x.cid)} (${x.metodo})${x.referencia?' ref '+x.referencia:''}`,[{c:cuentaDe(x.metodo),d:num(x.monto)},{c:'Cuentas por cobrar',h:num(x.monto)}],x.id));
 r.facturas.forEach(f=>{add(f.fecha,'Compra',`Factura ${f.numero||''} — ${f.proveedor}`,[{c:'Inventario',d:f.inv},{c:'Gastos — Compras varias',d:f.gastoM},{c:'ITBMS crédito fiscal',d:f.itbmsM},{c:'Cuentas por pagar',h:f.total}],f.id);
  if(f.pagada)add(f.fechaPago||f.fecha,'Pago',`Pago factura ${f.numero||''} — ${f.proveedor} (${f.metodoPago||'Efectivo'})`,[{c:'Cuentas por pagar',d:f.total},{c:cuentaDe(f.metodoPago||'Efectivo'),h:f.total}],f.id)});
 S.gastos.forEach(g=>add(g.fecha,'Gasto',`${g.categoria}: ${g.descripcion||''} (${g.metodo})`,[{c:'Gastos — '+(g.categoria||'Otros'),d:num(g.monto)},{c:cuentaDe(g.metodo),h:num(g.monto)}],g.id));
 S.depositos.forEach(d=>{const o=d.origen||ORIGEN_DEP[0];const cr=o.startsWith('Efectivo')||o.startsWith('Cobro')?'Caja':o==='Aporte del dueño'?'Capital':o==='Préstamo'?'Préstamos por pagar':'Otros ingresos';add(d.fecha,'Depósito',`Depósito ${d.banco||''} ${d.referencia?'ref '+d.referencia:''} (${o})`,[{c:'Banco',d:num(d.monto)},{c:cr,h:num(d.monto)}],d.id)});
 L.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);return L}
function saldosCuentas(L,hasta,desde){const s={};L.forEach(e=>{if(hasta&&e.fecha>hasta)return;if(desde&&e.fecha<desde)return;e.lineas.forEach(l=>{s[l.c]=s[l.c]||{d:0,h:0};s[l.c].d+=l.d||0;s[l.c].h+=l.h||0})});return s}
const saldoDeudor=(s,c)=>s[c]?r2(s[c].d-s[c].h):0;

function estadoResultados(desde,hasta){const k=calc();const s=saldosCuentas(k.libro,hasta,desde);const R={ingresos:{},gastos:{},ventas:0,costo:0,mermas:0,otros:0,gastoT:0};
 Object.keys(s).forEach(c=>{const v=s[c];if(c.startsWith('Ventas — ')){R.ingresos[c.slice(9)]=r2(v.h-v.d);R.ventas+=v.h-v.d}else if(c==='Costo de ventas')R.costo+=v.d-v.h;else if(c==='Mermas')R.mermas+=v.d-v.h;else if(c==='Otros ingresos')R.otros+=v.h-v.d;else if(c.startsWith('Gastos — ')){R.gastos[c.slice(9)]=r2(v.d-v.h);R.gastoT+=v.d-v.h}});
 R.bruta=R.ventas-R.costo-R.mermas;R.neta=R.bruta-R.gastoT+R.otros;R.itbmsCobrado=s['ITBMS por pagar']?s['ITBMS por pagar'].h-s['ITBMS por pagar'].d:0;R.itbmsPagado=s['ITBMS crédito fiscal']?s['ITBMS crédito fiscal'].d-s['ITBMS crédito fiscal'].h:0;return R}
function flujoCaja(desde,hasta){const k=calc();const ent={},sal={};let E=0,Sa=0;k.libro.forEach(e=>{if(e.fecha<desde||e.fecha>hasta||e.tipo==='Apertura')return;let n=0;e.lineas.forEach(l=>{if(l.c==='Caja'||l.c==='Banco')n+=(l.d||0)-(l.h||0)});n=r2(n);if(Math.abs(n)<0.005)return;const cat=e.tipo==='Gasto'?'Gasto — '+(e.desc.split(':')[0]):e.tipo==='Depósito'?'Depósito (aporte/préstamo/otro)':e.tipo==='Venta'?'Ventas de contado':e.tipo==='Cobro'?'Cobros a clientes':e.tipo==='Pago'?'Pagos a proveedores':e.tipo;if(n>0){ent[cat]=(ent[cat]||0)+n;E+=n}else{sal[cat]=(sal[cat]||0)-n;Sa-=n}});return{ent,sal,E:r2(E),S:r2(Sa),neto:r2(E-Sa)}}

function rango(p){const t=hoy();if(p==='hoy')return[t,t];if(p==='ayer'){const y=addDays(t,-1);return[y,y]}if(p==='semana'){const d=new Date(t+'T12:00:00');const dow=(d.getDay()+6)%7;return[addDays(t,-dow),t]}if(p==='mes')return[t.slice(0,8)+'01',t];if(p==='30')return[addDays(t,-29),t];if(p==='anio')return[t.slice(0,5)+'01-01',t];return['0000-00-00','9999-99-99']}
function finMes(m){const[y,mm]=m.split('-').map(Number);return hoy(new Date(y,mm,0,12))}
function resumen(a,b){const k=calc();const vs=k.ventas.filter(v=>v.fecha>=a&&v.fecha<=b);const R={total:0,sub:0,costo:0,margen:0,cant:0,n:vs.length,itbms:0,canal:{}};
 Object.keys(CANALES).forEach(c=>R.canal[c]={total:0,sub:0,costo:0,margen:0,cant:0,gastos:0});
 vs.forEach(v=>{R.total+=v.total;R.sub+=v.sub;R.costo+=v.costo;R.margen+=v.margen;R.cant+=num(v.cant);R.itbms+=v.itbmsM;const c=R.canal[v.canal];if(c){c.total+=v.total;c.sub+=v.sub;c.costo+=v.costo;c.margen+=v.margen;c.cant+=num(v.cant)}});
 const gs=S.gastos.filter(g=>g.fecha>=a&&g.fecha<=b);R.gastos=gs.reduce((s,g)=>s+num(g.monto),0);gs.forEach(g=>{if(R.canal[g.canal])R.canal[g.canal].gastos+=num(g.monto)});
 R.gastos+=k.facturas.filter(f=>f.fecha>=a&&f.fecha<=b).reduce((s,f)=>s+f.gastoM,0);
 R.mermas=-k.ajustes.filter(x=>x.fecha>=a&&x.fecha<=b&&x.valor<0).reduce((s,x)=>s+x.valor,0);
 R.utilidad=R.margen-R.gastos-R.mermas;return R}
function puntoEquilibrio(){const k=calc();const fijos=S.fijos.reduce((a,f)=>a+num(f.monto),0);const[a,b]=rango('30');const vs=k.ventas.filter(v=>v.fecha>=a&&v.fecha<=b);let cu,precio,fuente;
 const q=vs.reduce((s,v)=>s+num(v.cant),0);
 if(q>0){precio=vs.reduce((s,v)=>s+v.sub,0)/q;cu=vs.reduce((s,v)=>s+v.costo,0)/q;fuente='mezcla real de ventas de los últimos 30 días'}
 else{const p=P('pipa')||vendibles()[0];precio=precioCanal(p,'carrito');cu=p?k.costo[p.id]||0:0;fuente='precio de carrito de la pipa (aún no hay ventas)'}
 const contrib=precio-cu;const unidades=contrib>0?Math.ceil(fijos/contrib):Infinity;const dinero=contrib>0&&precio>0?fijos/(contrib/precio):Infinity;const dt=num(S.config.diasTrabajo)||26;
 return{fijos,precio,cu,contrib,unidades,dinero,porDia:isFinite(unidades)?Math.ceil(unidades/dt):Infinity,fuente,dt}}

function alertas(){const k=calc(),t=k.t,A=[];
 S.productos.forEach(p=>{const s=k.stock[p.id];if(s<0)A.push(['bad',`Stock negativo de <b>${esc(p.nombre)}</b>: ${nf(s)}. Revisa compras/ventas o registra la factura que falta.`,'inventario']);else if(s<=num(p.stockMin))A.push(['warn',`Stock bajo de <b>${esc(p.nombre)}</b>: quedan ${nf(s)} (mínimo ${nf(num(p.stockMin))}).`,'inventario'])});
 Object.values(k.cli).filter(c=>c.vencido>0).forEach(c=>A.push(['bad',`<b>${esc(c.nombre)}</b> tiene ${$f(c.vencido)} vencido (saldo total ${$f(c.saldo)}).`,'clientes:cobros']));
 k.facturas.filter(f=>f.vencida).forEach(f=>A.push(['bad',`Factura vencida de <b>${esc(f.proveedor)}</b> ${esc(f.numero||'')}: ${$f(f.total)} (venció ${fmtF(f.venc)}).`,'compras']));
 k.facturas.filter(f=>f.porVencer).forEach(f=>A.push(['warn',`Factura de <b>${esc(f.proveedor)}</b> vence el ${fmtF(f.venc)}: ${$f(f.total)}.`,'compras']));
 const pa=S.pedidos.filter(p=>p.estado==='Pendiente'&&p.fecha<t).length;if(pa)A.push(['bad',`${pa} pedido(s) atrasado(s) sin entregar.`,'clientes:pedidos']);
 const ph=S.pedidos.filter(p=>p.estado==='Pendiente'&&p.fecha===t);if(ph.length)A.push(['info',`Hoy toca entregar ${ph.length} pedido(s): ${ph.reduce((a,p)=>a+num(p.cant),0)} unidades.`,'clientes:pedidos']);
 const caja=saldoDeudor(k.saldos,'Caja');const pend=caja-num(S.config.fondoCaja);if(pend>=num(S.config.alertaEfectivo)&&num(S.config.alertaEfectivo)>0)A.push(['warn',`Tienes ${$f(pend)} en efectivo pendiente por depositar.`,'depositos']);
 vendibles().forEach(p=>{if(!precioCanal(p,'carrito')&&!precioCanal(p,'distribucion')&&!precioCanal(p,'embotellado'))A.push(['info',`Falta poner el precio de <b>${esc(p.nombre)}</b> en Configuración.`,'config'])});
 if(!S.fijos.length)A.push(['info','Agrega tus gastos fijos mensuales (Configuración) para calcular el punto de equilibrio.','config']);
 const meta=num(S.config.metaMensual);if(meta>0){const[a,b]=rango('mes');const v=resumen(a,b).total;const d=+t.slice(8);const dm=+finMes(t.slice(0,7)).slice(8);if(v<meta*d/dm*0.9)A.push(['warn',`Vas atrasado con la meta del mes: ${$f(v)} de ${$f(meta)} (${pct(v/meta)}). Esperado a hoy: ${$f(meta*d/dm)}.`,'inicio'])}
 return A}

/* ---------- Pedidos recurrentes: se generan solos ---------- */
function generarRecurrentes(){const t=hoy();const lim=addDays(t,num(S.config.horizonte)||7);let n=0;
 S.recurrentes.forEach(r=>{if(!r.activo)return;let d=r.generadoHasta?addDays(r.generadoHasta,1):t;if(r.desde&&d<r.desde)d=r.desde;if(d<t)d=t;
  while(d<=lim){const dow=new Date(d+'T12:00:00').getDay();if((r.dias||[]).includes(dow)&&!S.pedidos.some(p=>p.recId===r.id&&p.fecha===d)){S.pedidos.push({id:uid(),cid:r.cid,pid:r.pid,cant:num(r.cant),precio:r.precio,fecha:d,estado:'Pendiente',recId:r.id,notas:'Automático (pedido recurrente)'});n++}r.generadoHasta=d;d=addDays(d,1)}});
 return n}

/* ---------- Modal de formulario genérico ---------- */
let FORM=null;
function abrirForm(col,id,pre){const sc=SCHEMAS[col];const old=id?S[col].find(x=>x.id===id):null;const v={};
 sc.campos.forEach(f=>{let val=old?old[f.k]:(pre&&f.k in pre?pre[f.k]:(typeof f.def==='function'?f.def(v):f.def));if(val===undefined)val=f.type==='check'?false:f.type==='items'?[]:f.type==='days'?[]:'';v[f.k]=val});
 if(col==='facturas'&&!old&&!(pre&&pre.items))v.items=[{pid:'pipa',desc:'',cant:'',cu:''}];
 FORM={col,id,old,foto:null,quitarFoto:false};
 const h=`<div class="modal-bg" id="mbg"><form class="modal" id="mform" autocomplete="off"><h3><span>${old?'Editar':'Nuevo'}: ${esc(sc.titulo)}</span><button type="button" class="btn xs" onclick="A.cerrar()">✕</button></h3>
 <div class="mgrid">${sc.campos.map(f=>campoHTML(f,v[f.k],old)).join('')}</div>${sc.preview?'<div class="prev" id="mprev" style="margin-top:12px"></div>':''}
 <div class="mfoot">${old?`<button type="button" class="btn d" onclick="A.borrar('${col}','${old.id}')">🗑 Eliminar</button><span style="flex:1"></span>`:''}<button type="button" class="btn" onclick="A.cerrar()">Cancelar</button><button type="submit" class="btn p">💾 Guardar</button></div></form></div>`;
 document.getElementById('modal').innerHTML=h;const fm=document.getElementById('mform');
 fm.addEventListener('input',e=>formCambio(e));fm.addEventListener('change',e=>formCambio(e));fm.addEventListener('submit',e=>{e.preventDefault();guardarForm()});
 formCambio();if(col==='facturas'&&old&&old.foto)IDB.get(old.id).then(d=>{const el=document.getElementById('fotoPrev');if(d&&el)el.innerHTML=`<img src="${d}" class="thumb" style="width:90px;height:90px" onclick="A.verFoto('${old.id}')"> <label class="chk"><input type="checkbox" id="quitarFoto"> Quitar foto</label>`})}
function campoHTML(f,val,old){const id='f_'+f.k;const lab=`<label for="${id}">${esc(f.label)}${f.req?' *':''}</label>`;let inp;
 const opts=()=>{const o=typeof f.options==='function'?f.options():f.options;return o.map(x=>Array.isArray(x)?x:[x,x]).map(([a,b])=>`<option value="${esc(a)}"${String(a)===String(val)?' selected':''}>${esc(b)}</option>`).join('')};
 switch(f.type){
  case'select':inp=`<select id="${id}" name="${f.k}">${opts()}</select>`;break;
  case'check':return`<div class="fld ${f.full?'full':''}" data-k="${f.k}"><label class="chk"><input type="checkbox" id="${id}" name="${f.k}"${val?' checked':''}> ${esc(f.label)}</label></div>`;
  case'days':inp=`<div class="days">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="dias" value="${d}"${(val||[]).includes(d)?' checked':''}>${DIAS_L[d].slice(0,3)}</label>`).join('')}</div>`;break;
  case'textarea':inp=`<textarea id="${id}" name="${f.k}" rows="3">${esc(val)}</textarea>`;break;
  case'foto':inp=`<div class="row"><label class="btn">📷 Tomar foto<input type="file" id="${id}" accept="image/*" capture="environment" style="display:none" onchange="A.fotoSel(this)"></label><label class="btn">🖼️ Subir de galería<input type="file" accept="image/*" style="display:none" onchange="A.fotoSel(this)"></label></div><div id="fotoPrev" class="row" style="margin-top:6px"></div>`;break;
  case'items':inp=`<div id="itemsBox"><div class="itrow ithead"><span>Producto / concepto</span><span>Descripción</span><span>Cant.</span><span>Costo unit. $</span><span>Total</span><span></span></div>${(val||[]).map(itemRow).join('')}</div><button type="button" class="btn xs" onclick="A.addItem()">+ Agregar línea</button>`;break;
  case'number':inp=`<input type="number" step="any" inputmode="decimal" id="${id}" name="${f.k}" value="${esc(val)}">`;break;
  default:inp=`<input type="${f.type==='date'?'date':'text'}" id="${id}" name="${f.k}" value="${esc(val)}">`}
 return`<div class="fld ${f.full?'full':''}" data-k="${f.k}">${lab}${inp}</div>`}
function itemRow(i){const ops=`<option value="">— Otro (gasto: hielo, gas, etc.) —</option>`+S.productos.map(p=>`<option value="${p.id}"${p.id===i.pid?' selected':''}>${esc(p.nombre)} (inventario)</option>`).join('');
 return`<div class="itrow"><select class="it-pid">${ops}</select><input class="it-desc" placeholder="Descripción" value="${esc(i.desc||'')}"><input class="it-cant" type="number" step="any" inputmode="decimal" placeholder="Cant." value="${esc(i.cant)}"><input class="it-cu" type="number" step="any" inputmode="decimal" placeholder="Costo c/u" value="${esc(i.cu)}"><span class="it-tot r sm"></span><button type="button" class="btn xs d" onclick="this.parentNode.remove();formCambio()">✕ Quitar</button></div>`}
function leerForm(){const sc=SCHEMAS[FORM.col];const fm=document.getElementById('mform');const v={};
 sc.campos.forEach(f=>{if(f.type==='check')v[f.k]=fm.querySelector('#f_'+f.k).checked;else if(f.type==='days')v[f.k]=[...fm.querySelectorAll('input[name=dias]:checked')].map(x=>+x.value);
  else if(f.type==='items')v[f.k]=[...fm.querySelectorAll('#itemsBox .itrow:not(.ithead)')].map(r=>({pid:r.querySelector('.it-pid').value,desc:r.querySelector('.it-desc').value.trim(),cant:r.querySelector('.it-cant').value===''?'':num(r.querySelector('.it-cant').value),cu:r.querySelector('.it-cu').value===''?'':num(r.querySelector('.it-cu').value)}));
  else if(f.type==='foto'){}else{const el=fm.querySelector('#f_'+f.k);let x=el.value;if(f.type==='number')x=x===''?'':num(x);else if(f.type==='select'&&f.options===ITB_V||f.options===ITB_C)x=num(x);v[f.k]=x}});return v}
function formCambio(e){if(!FORM)return;const sc=SCHEMAS[FORM.col];const fm=document.getElementById('mform');let v=leerForm();
 if(e&&e.target&&e.target.name&&sc.auto&&e.type==='change'){sc.auto(e.target.name,v,(k,val)=>{const el=fm.querySelector('#f_'+k);if(el)el.value=val});v=leerForm()}
 sc.campos.forEach(f=>{if(f.show){const d=fm.querySelector(`.fld[data-k="${f.k}"]`);if(d)d.style.display=f.show(v)?'':'none'}});
 fm.querySelectorAll('#itemsBox .itrow:not(.ithead)').forEach(r=>{const t=num(r.querySelector('.it-cant').value)*num(r.querySelector('.it-cu').value);r.querySelector('.it-tot').textContent=$f(t);r.querySelector('.it-desc').style.display=r.querySelector('.it-pid').value?'none':''});
 const pv=document.getElementById('mprev');if(pv&&sc.preview)pv.innerHTML=sc.preview(v,FORM.old)}
async function guardarForm(){const sc=SCHEMAS[FORM.col];const v=leerForm();
 for(const f of sc.campos){if(f.req&&f.type!=='days'&&(v[f.k]===''||v[f.k]==null)){toast('Falta: '+f.label,1);return}}
 if(v.items)v.items=v.items.filter(i=>i.pid||i.desc||num(i.cant));
 const err=sc.validar&&sc.validar(v,FORM.old);if(err){toast(err,1);return}
 const w=sc.avisar&&sc.avisar(v,FORM.old);if(w&&!confirm(w))return;
 let rec;if(FORM.old){rec=Object.assign(FORM.old,v)}else{rec=Object.assign({id:uid(),creado:new Date().toISOString()},v);S[FORM.col].push(rec)}
 if(FORM.col==='facturas'){const q=document.getElementById('quitarFoto');if(q&&q.checked){await IDB.del(rec.id);rec.foto=false}if(FORM.foto){try{await IDB.put(rec.id,FORM.foto);rec.foto=true}catch(e){toast('No se pudo guardar la foto',1)}}}
 if(sc.despues)sc.despues(rec,FORM.old);guardar();cerrarModal();render();toast(`✅ ${sc.titulo} guardado`)}
function cerrarModal(){document.getElementById('modal').innerHTML='';FORM=null}
function borrarReg(col,id){const sc=SCHEMAS[col];const rec=S[col].find(x=>x.id===id);if(!rec)return;const no=sc.puedeBorrar&&sc.puedeBorrar(rec);if(no){alert(no);return}
 if(!confirm(sc.msgBorrar?sc.msgBorrar(rec):`¿Eliminar este registro (${sc.titulo})? Esta acción no se puede deshacer.`))return;
 if(sc.alBorrar)sc.alBorrar(rec);S[col]=S[col].filter(x=>x.id!==id);guardar();cerrarModal();render();toast('🗑 Eliminado')}

/* ---------- Acciones de negocio ---------- */
function entregarPedido(id,silencioso){const p=S.pedidos.find(x=>x.id===id);if(!p)return;const c=CL(p.cid);const pr=p.precio!==''&&p.precio!=null?num(p.precio):precioCanal(P(p.pid),'distribucion');
 const v={id:uid(),creado:new Date().toISOString(),fecha:hoy(),canal:'distribucion',pid:p.pid,cant:num(p.cant),precio:pr,metodo:c?.metodoDef||'Crédito',cid:p.cid,itbms:num(P(p.pid)?.itbms),notas:'Pedido entregado',pedidoId:p.id};

 put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k)).catch(()=>null)},del(k){return this.tx('readwrite',s=>s.delete(k)).catch(()=>null)},

 <div class="grid g4"><div class="kpi"><div class="l">Ventas</div><div class="v">${$f(T.t)}</div></div><div class="kpi"><div class="l">Unidades</div><div class="v">${nf(T.q)}</div></div><div class="kpi"><div class="l">Costo</div><div class="v">${$f(T.c)}</div></div><div class="kpi"><div class="l">Ganancia bruta</div><div class="v pos">${$f(T.m)}</div></div></div>

 <div class="card">${tabla([{k:'f',l:'Fecha'},{k:'c',l:'Canal'},{k:'p',l:'Producto'},{k:'cl',l:'Cliente'},{k:'q',l:'Cant.',n:1},{k:'pr',l:'Precio',n:1},{k:'t',l:'Total',n:1},{k:'g',l:'Ganancia',n:1},{k:'m',l:'Pago'}],vs.map(v=>({_r:v,f:fmtF(v.fecha),c:CANAL_ICO[v.canal]+' '+CANALES[v.canal],p:esc(nomP(v.pid)),cl:esc(nomC(v.cid)),q:nf(num(v.cant)),pr:$f(num(v.precio)),t:$f(v.total),g:$f(v.margen),m:v.metodo+(v.metodo==='Crédito'?(v.pend>0.004?` <span class="tag ${v.vencida?'bad':'warn'}">${v.vencida?'vencida':'debe '+$f(v.pend)}</span>`:' <span class="tag ok">cobrada</span>'):'')})),{acc:ED('ventas'),tot:{q:nf(T.q),t:$f(T.t),g:$f(T.m)},vacio:'No hay ventas en este rango.'})}</div>`};

 card(){const c=AUTH.cfg()||{};return`<div class="card"><h2>🔐 Acceso y seguridad <span class="sp"></span><button class="btn xs d" onclick="AUTH.cerrarSesion()">Cerrar sesión</button></h2>

  <div class="grid g2"><div class="fld"><label>Correo de acceso</label><input class="inp" id="cp_e" type="email" value="${esc(c.email||'')}"></div><div class="fld"><label>Contraseña actual</label><input class="inp" id="cp_a" type="password" autocomplete="current-password"></div>
  <div class="fld"><label>Nueva contraseña (mín. 6)</label><input class="inp" id="cp_n" type="password" autocomplete="new-password"></div><div class="fld"><label>Confirmar nueva contraseña</label><input class="inp" id="cp_n2" type="password" autocomplete="new-password"></div></div>
  <div class="row" style="margin-top:10px"><button class="btn p" onclick="AUTH.cambiar()">Cambiar contraseña / correo</button></div></div>`}
};

/* ===================== App instalable (PWA) =====================
   Android/Chrome: beforeinstallprompt. iPhone/iPad Safari: instrucciones (Compartir → Agregar a pantalla de inicio).
   No toca los datos (localStorage / IndexedDB) ni el acceso. */
const PWA={
 deferred:null,reg:null,_recargando:false,
 standalone(){return !!window.PipaCoAndroid||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true},
 ios(){const ua=navigator.userAgent||'';return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)},
 iosNoSafari(){const ua=navigator.userAgent||'';return PWA.ios()&&/CriOS|FxiOS|EdgiOS|OPiOS|GSA|Instagram|FBAN|FBAV/.test(ua)},
 puede(){return !PWA.standalone()&&(!!PWA.deferred||PWA.ios())},
 oculto(){try{return sessionStorage.getItem('pipaco_pwa_x')==='1'}catch(e){return false}},
 boton(){let b=document.getElementById('pwa-inst');
  if(!PWA.puede()||PWA.oculto()){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='pwa-inst';b.innerHTML='<button type="button" onclick="PWA.instalar()">📲 Instalar app</button><button type="button" class="x" aria-label="Ocultar" onclick="PWA.ocultar()">✕</button>';document.body.appendChild(b)}},
 ocultar(){try{sessionStorage.setItem('pipaco_pwa_x','1')}catch(e){}PWA.boton()},
 async instalar(){
  if(PWA.deferred){const ev=PWA.deferred;PWA.deferred=null;ev.prompt();try{const r=await ev.userChoice;if(r&&r.outcome==='accepted')toast('✅ Instalando PipaCo en tu pantalla de inicio')}catch(e){}PWA.boton();PWA.refrescarCard();return}
  if(PWA.ios())return PWA.instruccionesIOS();
  toast('Abre el menú ⋮ del navegador y elige “Instalar app” o “Agregar a pantalla de inicio”.')},
 instruccionesIOS(){const m=document.createElement('div');m.className='modal-bg';m.id='pwa-ios';m.style.zIndex='10003';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="modal" style="max-width:420px"><h3><span>📲 Instalar en iPhone / iPad</span><button class="btn xs" onclick="document.getElementById('pwa-ios').remove()">✕</button></h3>
  ${PWA.iosNoSafari()?'<div class="alert warn"><div class="t">Primero abre este enlace en <b>Safari</b> (en otros navegadores del iPhone no siempre aparece la opción).</div></div>':''}
  <ol class="ios-steps"><li>Toca <b>Compartir</b> <span style="font-size:18px">⎋</span> (el cuadrito con la flecha ↑, abajo o arriba en Safari).</li><li>Baja y toca <b>Agregar a pantalla de inicio</b> ➕.</li><li>Toca <b>Agregar</b>. El ícono 🥥 PipaCo aparece en tu pantalla.</li></ol>
  <div class="sm mu" style="margin-top:10px">Ábrela siempre desde ese ícono. La primera vez te pedirá crear tu acceso en la app instalada (en iPhone la app guarda sus datos aparte de Safari; si ya tenías datos en Safari, haz un respaldo y luego impórtalo en la app).</div>
  <button class="btn p" style="width:100%;justify-content:center;margin-top:12px" onclick="document.getElementById('pwa-ios').remove()">Entendido</button></div>`;
  document.body.appendChild(m)},
 card(){const inst=PWA.standalone();if(window.PipaCoAndroid&&PipaCoAndroid.checkUpdate){let v='';try{v=PipaCoAndroid.version()}catch(e){}
  return`<div class="card" id="pwa-card"><h2>📲 App Android</h2><div class="sm" style="margin-bottom:10px"><span class="tag ok">Instalada</span> Versión <b>${esc(v)}</b>. Entras con tu <b>huella o PIN del teléfono</b>; la contraseña de PipaCo queda como respaldo y para la versión web. Funciona sin internet; con internet revisa una vez al día si hay versión nueva.</div><div class="row"><button class="btn p" onclick="PipaCoAndroid.checkUpdate(false)">🔄 Buscar actualización</button></div>${PipaCoAndroid.diag?`<details style="margin-top:12px"><summary class="sm mu" style="cursor:pointer">🩺 Diagnóstico del desbloqueo con huella</summary><pre style="white-space:pre-wrap;font-size:11px;background:#0f0f12;padding:8px;border-radius:8px;margin-top:6px">${esc((()=>{try{return PipaCoAndroid.diag()}catch(e){return 'no disponible'}})())}</pre><div class="sm mu">Si la huella falla, manda una captura de esto.</div></details>`:''}</div>`}
  return`<div class="card" id="pwa-card"><h2>📲 App en el teléfono</h2>${inst?'<div class="sm"><span class="tag ok">Instalada</span> Estás usando PipaCo como app. Funciona sin internet.</div>':
  `<div class="sm mu" style="margin-bottom:10px">Instala PipaCo en tu pantalla de inicio: se abre como app, a pantalla completa y sin internet.</div><div class="row"><button class="btn p" onclick="PWA.instalar()">📲 Instalar app</button></div>
  <div class="sm mu" style="margin-top:10px"><b>Android:</b> botón “Instalar app” o menú ⋮ → Instalar app. <b>iPhone:</b> en Safari, Compartir → Agregar a pantalla de inicio.</div>`}${/Android/i.test(navigator.userAgent)?`<div class="sm mu" style="margin-top:10px">🔐 ¿Quieres entrar con tu <b>huella</b>? Eso solo está en la app Android (APK): <a href="https://github.com/conscaribe23-debug/pipaco-os/releases/latest/download/PipaCo.apk">descargar PipaCo.apk</a>.</div>`:''}</div>`},
 avisoApk(v){if(document.getElementById('apk-upd'))return;const d=document.createElement('div');d.id='apk-upd';d.setAttribute('role','button');
  d.textContent='⬇️ Hay una actualización disponible ('+v+'), toca para ver';d.onclick=()=>{d.remove();PipaCoAndroid.checkUpdate(false)};document.body.appendChild(d)},
 refrescarCard(){const c=document.getElementById('pwa-card');if(c)c.outerHTML=PWA.card()},
 aviso(w){if(document.getElementById('pwa-upd'))return;const d=document.createElement('div');d.id='pwa-upd';d.setAttribute('role','button');d.textContent='🔄 Hay una nueva versión, toca para actualizar';
  d.onclick=()=>{d.textContent='Actualizando…';PWA._recargando=true;const t=(PWA.reg&&PWA.reg.waiting)||w;if(t)t.postMessage({type:'SKIP_WAITING'});else location.reload()};document.body.appendChild(d)},
 registrar(){
  if(window.PipaCoAndroid||!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(PWA._recargando){PWA._recargando=false;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(reg=>{PWA.reg=reg;
   const vigilar=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)PWA.aviso(w)})};
   if(reg.waiting&&navigator.serviceWorker.controller)PWA.aviso(reg.waiting);
   vigilar(reg.installing);reg.addEventListener('updatefound',()=>vigilar(reg.installing));
   const buscar=()=>reg.update().catch(()=>{});setInterval(buscar,30*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)buscar()})
  }).catch(e=>console.warn('SW no registrado:',e&&e.message))},
 init(){
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();PWA.deferred=e;PWA.boton();PWA.refrescarCard()});
  window.addEventListener('appinstalled',()=>{PWA.deferred=null;PWA.boton();PWA.refrescarCard()});
  if(window.matchMedia){const mq=matchMedia('(display-mode: standalone)');mq.addEventListener&&mq.addEventListener('change',()=>{PWA.boton();PWA.refrescarCard()})}
  PWA.boton();
  if(document.readyState==='complete')PWA.registrar();else window.addEventListener('load',PWA.registrar)}
};

document.addEventListener('DOMContentLoaded',()=>{AUTH.gate(iniciar);try{PWA.init()}catch(e){console.warn(e)}});

</script>
</body>
</html>
