plugins { id 'com.android.application' }

// Copia la app web (index.html, manifest, íconos) desde la raíz del repo al APK.
def webRoot = rootProject.file('..')
def wwwOut = file('src/main/assets/www')
tasks.register('syncWeb', Copy) {
    from(webRoot) { include 'index.html', 'manifest.webmanifest', 'icons/**' }
    into wwwOut
}
tasks.named('preBuild') { dependsOn 'syncWeb' }

// Firma: lee keystore.properties (NO se sube a GitHub). Ver README.md.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    buildFeatures { buildConfig true }
    namespace 'com.pipaco.os'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pipaco.os'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '2.2.2'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    testOptions { unitTests { includeAndroidResources = true; all { maxHeapSize = '1g' } } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
